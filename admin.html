<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | SPBU 24.331.116</title><link rel="stylesheet" href="assets/style.css"></head><body class="admin-body">
<div id="loginView" class="login-wrap"><form class="login-card" onsubmit="adminLogin(event)"><div class="brand"><img class="brand-logo" src="assets/logo-ppla.png" alt="Logo PPLA">SPBU 24.331.116</div><p class="eyebrow" style="margin-top:28px">Administrator Portal</p><h1 style="font:800 30px Manrope">Masuk Dashboard</h1><p class="muted">Kelola konten company profile dan pesanan.</p><div class="field"><label>Username</label><input id="loginUser" class="form-control" autocomplete="username" required value="admin"></div><div class="field"><label>Password</label><input id="loginPass" type="password" class="form-control" autocomplete="current-password" required></div><button style="width:100%">Login <span>→</span></button><p id="loginError" class="small" style="color:#fb7185"></p><a class="small muted" href="index.html">← Kembali ke website</a></form></div>
<div id="adminView" class="admin-layout hidden"><aside class="sidebar"><div class="side-brand"><img class="brand-logo" src="assets/logo-ppla.png" alt="Logo PPLA"><span>SPBU ADMIN</span></div><div class="side-link active" data-page="dashboard">▦ Dashboard</div><div class="side-link" data-page="products">▣ Produk</div><div class="side-link" data-page="services">◇ Layanan</div><div class="side-link" data-page="news">▤ Berita</div><div class="side-link" data-page="carousel">▧ Carousel</div><div class="side-link" data-page="gallery">▧ Galeri</div><div class="side-link" data-page="orders">▣ Pesanan</div><div class="side-link" data-page="settings">⚙ Pengaturan</div><div style="margin-top:auto"></div><a class="side-link" href="index.html">↗ Lihat Website</a><div class="side-link" onclick="logout()">⇥ Keluar</div></aside><main class="admin-main"><div class="admin-top"><div class="admin-heading"><img class="brand-logo" src="assets/logo-ppla.png" alt="Logo PPLA"><div><div class="eyebrow">Management Center</div><h1 id="pageTitle" style="font:800 28px Manrope;margin:5px 0">Dashboard</h1></div></div><span class="pill" id="adminUserLabel">Administrator</span></div><div id="pageContent"></div></main></div>
